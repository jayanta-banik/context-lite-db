site_name: ContextDB
site_description: AI-native local database combining SQLite with semantic search, knowledge graphs, and RAG
site_url: https://jayanta-banik.github.io/context-lite-db/
repo_url: https://github.com/jayanta-banik/context-lite-db
repo_name: jayanta-banik/context-lite-db

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Relational Operations: guide/relational.md
    - Seeding the Database: guide/seeding.md
    - Semantic Search: guide/semantic-search.md
    - Knowledge Graph: guide/knowledge-graph.md
    - RAG: guide/rag.md
  - API Reference:
    - ContextDB: api/context_db.md
    - TableProxy: api/table_proxy.md
    - Seed Loader: api/seed.md
    - EmbeddingProvider: api/embeddings.md
    - VectorStore: api/vector_store.md
    - KnowledgeGraph: api/knowledge_graph.md
    - RAGEngine: api/rag.md
