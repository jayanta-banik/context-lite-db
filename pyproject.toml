[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-lite-db"
version = "0.1.0"
description = "An AI-native local database combining SQLite with semantic search, knowledge graphs, and RAG"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["database", "sqlite", "vector-search", "knowledge-graph", "rag", "ai", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=2.0"]
dev = [
    "pytest>=7.0",
    "sentence-transformers>=2.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["context_lite_db*", "ContextDB*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
